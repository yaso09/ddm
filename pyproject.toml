[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddm"
version = "0.1.0"
description = "Distance-Decomposed Model (DDM): a distance-aware autoregressive language model research project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DDM Research" },
]
keywords = ["language-model", "attention", "research", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "datasets>=2.14",
    "transformers>=4.30",
    "numpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "jupyter",
]

[project.scripts]
ddm-train = "ddm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ddm"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
]
