# Reference transformer baseline: decoder-only, learned absolute
# positional embeddings, standard causal mask
model_type: transformer
d_model: 128
n_layers: 2
n_heads: 4
max_seq_len: 128
dropout: 0.0
batch_size: 32
lr: 3.0e-4
epochs: 5
seeds: [0]
dataset_name: wikitext
dataset_config: wikitext-2-raw-v1
cache_dir: hf_cache
shuffle: false
eval_buckets: [[0, 10], [10, 50], [50, 200]]
log_every: 50
save_dir: checkpoints
