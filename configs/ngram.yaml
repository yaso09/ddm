# 3-gram baseline: P(x_t | x_{t-2}, x_{t-1}, x_t)
model_type: ngram
d_model: 128
n_context: 3
max_seq_len: 128
dropout: 0.0
batch_size: 32
lr: 3.0e-4
epochs: 14
seeds: [0]
dataset_name: wikitext
dataset_config: wikitext-2-raw-v1
cache_dir: hf_cache
shuffle: false
eval_buckets: [[0, 10], [10, 50], [50, 200]]
log_every: 50
save_dir: checkpoints
