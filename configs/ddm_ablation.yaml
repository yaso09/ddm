# DDM ablation: identical to ddm_base but g(k) is NOT learned,
# fixed to 1/k (isolates the contribution of learning the distance curve)
model_type: ddm_ablation
d_model: 128
n_layers: 2
n_heads: 4
max_seq_len: 128
learn_g: false
dropout: 0.0
batch_size: 32
lr: 3.0e-4
epochs: 5
seeds: [0, 1]
dataset_name: wikitext
dataset_config: wikitext-2-raw-v1
cache_dir: hf_cache
shuffle: false
eval_buckets: [[0, 10], [10, 50], [50, 200]]
log_every: 50
save_dir: checkpoints
